[workspace]
members = ["src-tauri"]
resolver = "3"

[profile.dev]
# DuckDB (bundled C++) is very slow to build and run unoptimized; optimize
# dependencies even in debug builds so tests and `tauri build --debug` stay usable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
