<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — DataLiq</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/dataliq/assets/icon.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("/dataliq/assets/fonts/archivo-latin.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-stretch: 62% 125%;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("/dataliq/assets/fonts/jetbrains-mono-latin.woff2") format("woff2-variations");
        font-weight: 100 800;
      }
      :root {
        color-scheme: light dark;
        --paper: #f1f0ec;
        --ink: #0e0f12;
        --muted: #5f6168;
        --grid: rgb(14 15 18 / 0.06);
        --accent: #2155f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #0d0e11;
          --ink: #edece7;
          --muted: #9c9ea6;
          --grid: rgb(237 236 231 / 0.06);
          --accent: #6b8fff;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background:
          linear-gradient(to bottom, var(--grid) 1px, transparent 1px) 0 0 / 64px 64px,
          linear-gradient(to right, var(--grid) 1px, transparent 1px) 0 0 / 64px 64px,
          var(--paper);
        color: var(--ink);
        font:
          17px/1.6 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        text-align: center;
      }
      p.code {
        margin: 26px 0 0;
        font:
          600 12px/1 "JetBrains Mono",
          ui-monospace,
          monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        margin: 14px 0 10px;
        font-family: "Archivo", system-ui, sans-serif;
        font-stretch: 125%;
        font-weight: 800;
        font-size: clamp(34px, 6vw, 64px);
        line-height: 1;
        letter-spacing: -0.04em;
      }
      p {
        color: var(--muted);
      }
      a {
        display: inline-block;
        margin-top: 12px;
        padding: 16px 22px;
        background: var(--ink);
        color: var(--paper);
        font:
          600 12px/1 "JetBrains Mono",
          ui-monospace,
          monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/dataliq/assets/icon.svg" width="88" height="88" alt="" />
      <p class="code">#REF! · 404</p>
      <h1>This page isn't here.</h1>
      <p>The link may be old.</p>
      <a href="/dataliq/">Go to the DataLiq home page</a>
    </main>
  </body>
</html>
