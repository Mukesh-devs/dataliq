<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — DataLiq</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/dataliq/assets/icon.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: "Geist";
        src: url("/dataliq/assets/fonts/geist-latin.woff2") format("woff2-variations");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("/dataliq/assets/fonts/jetbrains-mono-latin.woff2") format("woff2-variations");
        font-weight: 100 800;
      }
      :root {
        color-scheme: light dark;
        --page: #f6f7f9;
        --panel: #ffffff;
        --ink: #0b1020;
        --muted: #5b6475;
        --line: #dde1e8;
        --grid: rgb(79 70 229 / 0.07);
        --accent: #4f46e5;
        --accent-ink: #ffffff;
        --accent-soft: rgb(79 70 229 / 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #090c13;
          --panel: #10141e;
          --ink: #e9edf5;
          --muted: #98a0b0;
          --line: #222938;
          --grid: rgb(129 140 248 / 0.07);
          --accent: #818cf8;
          --accent-ink: #090c13;
          --accent-soft: rgb(129 140 248 / 0.13);
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background:
          linear-gradient(to bottom, var(--grid) 1px, transparent 1px) 0 0 / 64px 64px,
          linear-gradient(to right, var(--grid) 1px, transparent 1px) 0 0 / 64px 64px,
          var(--page);
        color: var(--ink);
        font:
          17px/1.6 "Geist",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        text-align: center;
      }
      main {
        display: grid;
        justify-items: center;
      }
      p.code {
        margin: 26px 0 0;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--accent);
        font:
          700 13px/1.3 "JetBrains Mono",
          ui-monospace,
          monospace;
      }
      h1 {
        margin: 16px 0 8px;
        font-weight: 650;
        font-size: clamp(36px, 6vw, 64px);
        line-height: 1;
        letter-spacing: -0.05em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      a {
        display: inline-block;
        margin-top: 28px;
        padding: 15px 22px;
        border-radius: 12px;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
        font-size: 15px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/dataliq/assets/icon.svg" width="88" height="88" alt="" />
      <p class="code">#REF! · 404</p>
      <h1>This page isn't here.</h1>
      <p>The link may be old.</p>
      <a href="/dataliq/">Go to the DataLiq home page</a>
    </main>
  </body>
</html>
