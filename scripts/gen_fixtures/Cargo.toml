[package]
name = "gen_fixtures"
version = "0.0.0"
description = "Generates BigView's large, git-ignored test fixtures"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "gen_fixtures"
path = "src/main.rs"

[dependencies]
duckdb = { version = "=1.10506.0", features = ["bundled", "json", "parquet"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
rust_xlsxwriter = { version = "0.99.1", features = ["constant_memory"] }
sha2 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
