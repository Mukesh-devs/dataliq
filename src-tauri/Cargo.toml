[package]
name = "bigview"
version = "0.0.0"
description = "Open huge tabular files instantly"
authors = ["BigView contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.85"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (see Tauri docs).
name = "bigview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
