[package]
name = "dataliq"
version = "1.0.0"
description = "Open huge tabular files instantly"
authors = ["DataLiq contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.85"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (see Tauri docs).
name = "dataliq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
glob = "=0.3.4"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri = { version = "=2.12.3", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# `json` and `parquet` are compiled in so DuckDB never needs to download extensions.
duckdb = { version = "=1.10506.0", features = ["bundled", "json", "parquet"] }
# Same major version as duckdb's arrow; adds the IPC writer.
arrow = { version = "58.4.1", default-features = false, features = ["ipc"] }
thiserror = "2.0.21"
# Local "today" for relative date filters (already in the tree via arrow).
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tracing = "0.1.44"
dirs = "7.0.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
sha2 = "0.11.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
parking_lot = "0.12.5"
flate2 = "1.1.10"
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-single-instance = "=2.5.3"
calamine = { version = "=0.36.1", default-features = false }
base64 = "=0.22.1"
rust_xlsxwriter = { version = "=0.99.1", features = ["constant_memory"] }
tauri-plugin-updater = "=2.14.0"

[dev-dependencies]
criterion = "0.8.2"
insta = "1.49.0"
tempfile = "3.27.0"

[[bench]]
name = "arrow_transfer"
harness = false
