name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Only PR runs cancel older runs: DuckDB's first (uncached) build takes a
# while, and a cancelled push run would never save the Rust cache.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental builds only bloat the cache in CI.
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # DuckDB's bundled C++ build is slow: cache target/ aggressively.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bigview-${{ matrix.os }}
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test
      - name: pnpm lint
        run: pnpm lint
      - name: pnpm typecheck
        run: pnpm typecheck
      - name: pnpm test
        run: pnpm test

      - name: Tauri debug build
        run: pnpm tauri build --debug

  e2e:
    name: UI flows (Playwright)
    # Screenshot baselines are rendered on Ubuntu 24.04 Chromium (see docs/DECISIONS.md).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
