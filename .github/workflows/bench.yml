name: Bench

# Small benchmark suite (100 MB fixtures) with a regression guard: fails when
# a flow gets more than 30% slower than bench/baseline/<os>.json.
# Also runs when the benchmark itself changes, so a new baseline can be recorded.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # Path filters only apply to branch pushes; tag pushes always run.
    branches: ["**"]
    paths:
      - "bench/**"
      - "scripts/bench.mjs"
      - "src-tauri/tests/it/bench_small.rs"
      - ".github/workflows/bench.yml"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  bench:
    name: Bench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Same cache as the CI check job on this OS.
          shared-key: bigview-${{ matrix.os }}

      - name: Benchmarks
        run: node scripts/bench.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: target/bench/
