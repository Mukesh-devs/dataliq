name: Website

# Publishes website/ to GitHub Pages (https://mukesh-devs.github.io/dataliq/).
# The site is static files, so there is no build: the folder is uploaded as it is.
# The version and downloads on the page come from the GitHub Releases API in the
# visitor's browser, so publishing a release needs no new deployment.
#
# One-time setup: Settings › Pages › Build and deployment › Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer one waits for the one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
