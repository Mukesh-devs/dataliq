<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- DataLiq: a database stack (data) with a forward chevron (fast), on a
       dark tile sized to Apple's icon grid (824 px tile in a 1024 px canvas). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2e3b"/>
      <stop offset="1" stop-color="#121319"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#edge)" stroke-width="3"/>
  <g fill="url(#brand)">
    <path d="M 250 330 C 250 270, 610 270, 610 330 V 400 C 610 460, 250 460, 250 400 Z"/>
    <path d="M 250 470 C 300 510, 560 510, 610 470 V 540 C 610 600, 250 600, 250 540 Z"/>
    <path d="M 250 610 C 300 650, 560 650, 610 610 V 680 C 610 740, 250 740, 250 680 Z"/>
  </g>
  <ellipse cx="430" cy="330" rx="180" ry="44" fill="#ffffff" fill-opacity="0.25"/>
  <path d="M 660 380 L 800 512 L 660 644" fill="none" stroke="url(#bolt)" stroke-width="64"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
